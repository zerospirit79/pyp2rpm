name: Run tox with various Python versions

on:
  push:
  pull_request:

jobs:
  tox_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run Tox tests
        uses: fedora-python/tox-github-action@main
        with:
          tox_env: ${{ matrix.tox_env }}
          dnf_install: python3-wheel ${{ matrix.dnf_install }}

    strategy:
      fail-fast: false
      matrix:
        # Interpreters available in fedorapython/fedora-python-tox:f43
        tox_env: [py39, py310, py311, py312, py313]
        include:
          - tox_env: py310
            dnf_install: libffi-devel
